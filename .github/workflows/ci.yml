name: Application CI

on:
  push:
    branches:
      - main
      - feat/functional-platform-identity-organizations
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
